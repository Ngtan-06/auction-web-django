{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sàn Đấu Giá Trực Tuyến</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    {% if not request.resolver_match.url_name in 'login,register' %}
        <header class="navbar navbar-expand-lg premium-navbar shadow-sm px-3 mb-4">
            {% include 'navbar.html' %}
        </header>
    {% endif %}


    <main class="container">
        {% block content %}{% endblock %}
        {% block Register %}{% endblock %}
    </main>

    <footer class="text-center p-4 mt-5">
        <div class="container">
            <p class="mb-0">&copy; 2026 Hệ thống Đấu giá Trực tuyến Cao cấp. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
