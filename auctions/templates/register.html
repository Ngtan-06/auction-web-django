{% extends "base.html" %}

{% block content %}
<section class="vh-100 d-flex align-items-center" style="background-color: #f8fafc;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm" style="border-radius: 25px;">
          <div class="card-body p-4 p-md-5">
            <h2 class="text-center fw-bold mb-4">Đăng ký</h2>
            <form method="POST">
              {% csrf_token %}
              {% for field in form %}
                <div class="mb-3">
                  {{ field.label_tag }}
                  {{ field }}
                  {% if field.errors %}
                    <small class="text-danger">{{ field.errors.0 }}</small>
                  {% endif %}
                </div>
              {% endfor %}

              <div class="d-grid mt-4">
                <button type="submit" class="btn btn-primary btn-lg">Đăng ký</button>
              </div>
              <p class="text-center mt-3 small">
                Đã có tài khoản? <a href="{% url 'login' %}">Đăng nhập</a>
              </p>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
