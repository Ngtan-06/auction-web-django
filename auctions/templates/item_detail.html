{% extends "base.html" %}

{% block title %}Chi tiết sản phẩm{% endblock %}

{% block content %}
<h2>{{ item.name }}</h2>
<img src="{{ item.image_url }}" class="img-fluid mb-3" alt="{{ item.name }}">
<p>{{ item.description }}</p>
<p><strong>Người bán:</strong> {{ item.seller_id }}</p>
<a href="{% url 'home' %}" class="btn btn-secondary">Quay lại</a>
{% endblock %}
