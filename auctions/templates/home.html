{% extends 'base.html' %}

{% block content %}
<h2 class="mb-4">Trang chủ đấu giá</h2>
<div class="row">
    {% for item in items %}
    <div class="col-md-3">
        <div class="card mb-4">
            <img src="{{ item.image_url }}" class="card-img-top" alt="{{ item.name }}">
            <div class="card-body">
                <h5 class="card-title">{{ item.name }}</h5>
                <p class="card-text">{{ item.description|truncatewords:15 }}</p>
                <a href="{% url 'item_detail' item.id %}" class="btn btn-primary">Xem chi tiết</a>
            </div>
        </div>
    </div>
    {% empty %}
    <p>Chưa có sản phẩm nào.</p>
    {% endfor %}
</div>
{% endblock %}
