services:
  - type: web
    name: django-auction
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "daphne auction_site.asgi:application --port $PORT --bind 0.0.0.0"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: your-db-name
          property: connectionString
      - key: SECRET_KEY
        generateValue: true